<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>有符号功率域回放</title>
<script src="plotly.min.js"></script>
<style>
body{margin:20px;background:#fafafa;color:#24323a;font:14px system-ui,"Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;gap:16px;margin-bottom:12px}header strong{font-size:18px}
button,select{font:inherit;padding:6px 10px;border:1px solid #ccd3d7;border-radius:4px;background:white;color:inherit;cursor:pointer}
.controls{display:flex;align-items:center;gap:8px}input[type=range]{flex:1;min-width:100px}
#plots{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.plot{height:540px;background:white}
#reference{height:500px}#footer{margin:10px 0;color:#53636c;line-height:1.7}#status{margin:10px 0;height:24px}
@media(max-width:1000px){#plots{grid-template-columns:1fr}.plot{height:440px}}
</style></head><body>
<header><strong id="title"></strong><span>正有功：负荷　负有功：光伏</span></header>
<div class="controls"><button id="first">开始</button><button id="previous">上一帧</button><button id="play">播放</button><button id="next">下一帧</button><button id="last">最后</button>
<input id="slider" aria-label="回放帧" type="range" min="0" step="1"><span id="frame"></span></div>
<div id="status"></div>
<div class="controls"><label for="scheme">网架 / 分区：</label><select id="scheme"><option value="active">跟随当前网架</option></select><span>拖动三维图可旋转；滚轮缩放；双击恢复视角。</span></div>
<div id="plots"><div id="global" class="plot"></div><div id="local" class="plot"></div></div>
<div id="footer"></div><div id="reference"></div>
<script>
'use strict';
const data=__DATA__;
const d=data.settings.load_nodes.length, history=data.history, byId=id=>document.getElementById(id);
const colors={inner:'#318b82',outer:'#a7b3bd',global:'#bc5550',cut:'#8064ad',point:'#df8e35',reference:'#667f9a'};
let index=history.length-1, state={}, shownScheme='active';
let pendingFrame=null, renderTask=null, playing=false, playback=null;
const config={responsive:true,displaylogo:false,scrollZoom:true};
const merge=(target,patch)=>{for(const [k,v] of Object.entries(patch))target[k]=(k==='schemes'||k==='cut_history')?{...target[k],...v}:v;};
function frameAt(n){const out={};for(let i=0;i<=n;i++)merge(out,history[i].patch);return out;}
function rgba(hex,a){const c=hex.match(/\w\w/g).map(x=>parseInt(x,16));return `rgba(${c.join(',')},${a})`;}
function polygons(geometries,color,name,fill=true,wire=true){
 const traces=[];
 for(const g of geometries){
  const p=g.points;if(!p.length)continue;
  if(d===2){const pts=p.length>2?[...p,p[0]]:p;
   traces.push({type:'scatter',x:pts.map(v=>v[0]),y:pts.map(v=>v[1]),mode:p.length===1?'markers':'lines',
    line:{color,width:1.5},marker:{color,size:5},fill:fill&&p.length>2?'toself':'none',fillcolor:rgba(color,.15),name,showlegend:false,hoverinfo:'name'});
  }else{
   if(fill&&g.faces.length)traces.push({type:'mesh3d',x:p.map(v=>v[0]),y:p.map(v=>v[1]),z:p.map(v=>v[2]),
    i:g.faces.map(f=>f[0]),j:g.faces.map(f=>f[1]),k:g.faces.map(f=>f[2]),color,opacity:wire ? .14 : 1,name,showlegend:false,hoverinfo:'name'});
   const line=[];for(const edge of g.edges)line.push(p[edge[0]],p[edge[1]],null);
   if(wire||!g.faces.length)traces.push({type:'scatter3d',x:line.map(v=>v===null?null:v[0]),y:line.map(v=>v===null?null:v[1]),z:line.map(v=>v===null?null:v[2]),
    mode:'lines',line:{color,width:2},name,showlegend:false,hoverinfo:'name'});
   if(p.length===1)traces.push({...marker(p[0],color,name),showlegend:false});
  }
 }
 // 图例每类只保留一项。
 if(traces.length)traces[0].showlegend=true;
 return traces;
}
function marker(p,color,name){return {type:d===2?'scatter':'scatter3d',x:[p[0]],y:[p[1]],...(d===3?{z:[p[2]]}:{}),
 mode:'markers',marker:{color,size:d===2?9:4},name,showlegend:true};}
function markers(s){
 const traces=[];
 for(const [key,color,name] of [['sp_point',colors.point,'SP 检查点'],['global_point',colors.global,'查漏见证']])
  if(s[key])traces.push(marker(s[key].p,color,name));
 if(s.ray){const p=[s.ray.anchor,s.ray.target];traces.push({type:d===2?'scatter':'scatter3d',x:p.map(v=>v[0]),y:p.map(v=>v[1]),
  ...(d===3?{z:p.map(v=>v[2])}:{}),mode:'lines',line:{color:colors.point,width:2,dash:'dash'},name:'射线'});
  if(s.ray.p)traces.push(marker(s.ray.p,colors.inner,'射线认证点'));
 }
 return traces;
}
function extent(geometries){
 const points=geometries.flatMap(g=>g.points);
 return Array.from({length:d},(_,j)=>{const a=Math.min(...points.map(p=>p[j])),b=Math.max(...points.map(p=>p[j]));const pad=Math.max((b-a)*.04,1);return[a-pad,b+pad];});
}
function layout(title,ranges){
 const labels=data.settings.load_nodes.map(n=>`p<sub>${n}</sub> (kW)`);
 const axes=ranges.map((range,j)=>({title:{text:labels[j]},range,zeroline:true,zerolinecolor:'#bbc4ca',gridcolor:'#e6ebee'}));
 const base={title:{text:title,font:{size:15},x:.04},paper_bgcolor:'white',plot_bgcolor:'white',font:{family:'Arial, Microsoft YaHei',size:12},
  margin:{l:58,r:20,b:48,t:58},legend:{orientation:'h',x:0,y:1.04,font:{size:11}},uirevision:'keep-camera'};
 if(d===2)return {...base,xaxis:axes[0],yaxis:axes[1]};
 return {...base,margin:{l:0,r:0,b:0,t:50},scene:{xaxis:axes[0],yaxis:axes[1],zaxis:axes[2],aspectmode:'cube',
  camera:{eye:{x:1.5,y:1.6,z:1.2},projection:{type:'orthographic'}}}};
}
function show(n){
 pendingFrame=Math.max(0,Math.min(n,history.length-1));
 if(!renderTask)renderTask=drawFrames().finally(()=>{renderTask=null;});
 return renderTask;
}
async function drawFrames(){
 // 逐帧等待绘图完成；拖动滑块时只保留最新请求。
 while(pendingFrame!==null){
 index=pendingFrame;pendingFrame=null;state=frameAt(index);
 byId('slider').value=index;byId('frame').textContent=`${index+1} / ${history.length}`;
 byId('status').textContent=`${history[index].elapsed.toFixed(2)} s　${state.partition||''}　${state.phase}　${state.event==='region_end'?(state.result.certified?'本分区已取得覆盖证书':'本分区达到时限'):''}`;
 const schemes=Object.values(state.schemes),inner=schemes.map(s=>s.inner),ranges=extent(state.global_outer);
 const global=Plotly.react('global',[...polygons(state.global_outer,colors.global,'G 外包络',false),...polygons(inner,colors.inner,"G′ 认证并集",true,false),...markers(state)],layout('a　全局功率域',ranges),config);
 const key=shownScheme==='active'?(state.active_scheme||Object.keys(state.schemes).at(-1)):shownScheme;
 const row=state.schemes[key];let local=d===3?[{type:'scatter3d',x:[],y:[],z:[]}]:[];
 if(row){local=[...polygons([row.outer],colors.outer,'Nₓ 外包络'),...polygons([row.inner],colors.inner,"N′ₓ 认证域")];
  const cuts=Object.values(state.cut_history).filter(c=>c.scheme===key);
  if(cuts.length)local.push(...polygons([cuts.at(-1).geometry],colors.cut,'最近一条割'));
  if(shownScheme==='active')local.push(...markers(state));
 }
 await Promise.all([global,Plotly.react('local',local,layout(`b　${key||'尚未建立网架'}　外包络与认证域`,row?extent([row.outer]):ranges),config)]);
 }
}
async function playFrames(){
 if(index===history.length-1)await show(0);
 while(playing&&index<history.length-1){
  await new Promise(resolve=>setTimeout(resolve,350));
  if(playing)await show(index+1);
 }
 playing=false;byId('play').textContent='播放';
}
function drawReference(){
 if(!data.reference){byId('reference').hidden=true;return;}
 const ref=data.reference,ranges=data.settings.load_nodes.map((_,j)=>[ref.axis_lower[j],ref.bounds[j]]);let traces=[];
 if(d===2){const n=ref.states.length;traces.push({type:'heatmap',x:Array.from({length:n},(_,j)=>ref.axis_lower[0]+(j+.5)*(ref.bounds[0]-ref.axis_lower[0])/n),
  y:Array.from({length:n},(_,j)=>ref.axis_lower[1]+(j+.5)*(ref.bounds[1]-ref.axis_lower[1])/n),
  z:Array.from({length:n},(_,j)=>ref.states.map(row=>row[j]===1?1:null)),colorscale:[[0,'#e1e7ef'],[1,'#e1e7ef']],zmin:0,zmax:1,showscale:false,hoverinfo:'skip'});
 }else{const p=ref.surface.points,f=ref.surface.faces;traces.push({type:'mesh3d',x:p.map(v=>v[0]),y:p.map(v=>v[1]),z:p.map(v=>v[2]),
  i:f.map(v=>v[0]),j:f.map(v=>v[1]),k:f.map(v=>v[2]),color:colors.reference,opacity:.13,name:'独立 SOCP 扫描',showlegend:true,hoverinfo:'skip'});}
 traces.push(...polygons(data.result.inner,colors.inner,"最终 G′",true,false),...polygons(data.result.outer,colors.global,'最终 G',false));
 Plotly.newPlot('reference',traces,layout('c　最终计算域与独立 SOCP 网格参考',ranges),config);
}
const metrics=data.result.metrics,counts=data.result.counts;
const comparison=data.reference ? ` G′ 遗漏 ${metrics.inner.mr_percent.toFixed(3)}%，多余 ${metrics.inner.fr_percent.toFixed(3)}%；G 遗漏 ${metrics.outer.mr_percent.toFixed(3)}%，多余 ${metrics.outer.fr_percent.toFixed(3)}%。` : ' 独立扫描尚未完成；完成后刷新页面查看误差与参考域。';
byId('title').textContent=`${d}D · 节点 ${data.settings.load_nodes.join('、')} · 有符号功率域`;
byId('slider').max=history.length-1;
byId('slider').oninput=e=>show(Number(e.target.value));
byId('first').onclick=()=>show(0);byId('last').onclick=()=>show(history.length-1);
byId('previous').onclick=()=>show(index-1);byId('next').onclick=()=>show(index+1);
byId('play').onclick=()=>{
 playing=!playing;byId('play').textContent=playing?'暂停':'播放';
 if(playing&&!playback)playback=playFrames().finally(()=>{playback=null;});
};
for(const key of Object.keys(frameAt(history.length-1).schemes)){const option=document.createElement('option');option.value=option.textContent=key;byId('scheme').appendChild(option);}
byId('scheme').onchange=e=>{shownScheme=e.target.value;show(index);};
byId('footer').textContent=`构域 ${data.result.timing.total_seconds.toFixed(2)} s / 上限 ${data.settings.time_limit} s；${data.result.certified?'全部分区已认证':'达到时限，尚未取得全部分区覆盖证书'}。`+
 comparison+
 ` SP ${counts.sp} 次，割 ${counts.cuts} 条，射线 ${counts.ray} 次，查漏 ${counts.global_search} 次。参考是同一 SOCP 模型的网格扫描，不是非凸 AC 真值。`;
drawReference();show(index);
</script></body></html>
