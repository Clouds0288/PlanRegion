<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>节点功率：预算对照与切割回放</title>
<style>
body{font:14px system-ui,"Microsoft YaHei",sans-serif;color:#233541;background:white;margin:14px auto;max-width:1200px;padding:0 12px}
button,select,input{font:inherit}button,select{padding:5px 9px;border:1px solid #bac6cd;border-radius:3px;background:white;color:inherit}
button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #48799a}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}.controls label{display:inline-flex;align-items:center;gap:4px}
#slider{flex:1;min-width:180px;accent-color:#48799a}#iteration{width:70px}#status{min-height:22px;margin:8px 0;color:#344d5e}
#frontier{height:290px}#regions{height:810px}.caption{font-size:13px;color:#526571;margin:5px 0 12px}
details{border-top:1px solid #dde4e8;padding:9px 0;overflow:auto}summary{cursor:pointer;color:#2d526b}table{border-collapse:collapse;white-space:nowrap;font-size:12px;margin:9px 0}
th,td{border:1px solid #dde4e8;padding:4px 7px;text-align:right}th{background:#f5f7f8}td:first-child,th:first-child{text-align:left}
#history-table{max-height:330px;overflow:auto}.note{font-size:13px;margin:8px 0}
@media(max-width:700px){body{padding:0 4px}#regions{height:710px}.controls{gap:5px}}
</style><script>__PLOTLY__</script></head><body>
<div class="controls">
 <label>数据 <select id="dataset" aria-label="回放数据"></select></label>
 <label>步进 <select id="mode" aria-label="回放步进"><option value="rounds">全部轮次</option><option value="cuts">仅新增割</option></select></label>
 <label>间隔 <select id="speed" aria-label="播放间隔"><option value="250">0.25 秒</option><option value="500">0.5 秒</option><option value="1000" selected>1 秒</option><option value="2000">2 秒</option></select></label>
 <span id="parameters"></span>
</div>
<div class="controls">
 <button id="start" aria-label="回到初始轮">初始</button><button id="previous" aria-label="上一轮">上一步</button>
 <button id="play" aria-label="播放或暂停">播放</button><button id="next" aria-label="下一轮">下一步</button><button id="end" aria-label="跳到最后一轮">最后</button>
 <input id="slider" type="range" min="0" step="1" aria-label="回放进度">
 <label>第 <input id="iteration" type="number" min="0" step="1" aria-label="指定轮次"> 轮</label>
</div>
<p id="status" role="status">正在载入回放…</p>
<div id="frontier" aria-label="总负荷与最低预算前沿"></div>
<p class="caption">图1｜总负荷固定、节点分配可变时的最低预算。灰虚线为独立 LP 基准；蓝线为当前累计割的投影。</p>
<div class="controls">
 <label><input id="wire" type="checkbox" checked> 显示最近加割前的边界</label>
 <label><input id="sync" type="checkbox" checked> 四图联动旋转</label>
 <button id="reset">重置视角</button>
 <span>拖动旋转，滚轮缩放；切换轮次保留视角。</span>
</div>
<div id="regions" aria-label="不同建设预算下的三维负荷域"></div>
<p class="caption">图2｜四个面板仅改变建设预算，坐标范围相同。蓝色为当前外近似，灰线为最近加割前边界，橙色为最近割对应的边界。无预算上限仍保留线路、电压和配变约束；仅在全部认证结束后标为完整可行域。</p>
<details open id="current"><summary>本轮建设选择与节点功率</summary><div></div></details>
<details id="states"><summary>SP 运行变量</summary><div></div></details>
<details id="duals"><summary>53 条约束、对偶乘子与残差</summary><div></div></details>
<details id="cuts"><summary>截至本轮的全部累计割及范围</summary><div></div></details>
<details id="coefficients"><summary>全部累计割的建设系数 βx</summary><div></div></details>
<details id="history"><summary>所有历史轮次的建设选择与查询结果</summary><div id="history-table"></div></details>
<script>
(async () => {
 const bytes=Uint8Array.from(atob('__PAYLOAD__'),c=>c.charCodeAt(0));
 const bundle=JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
 const el=id=>document.getElementById(id), blue='#48799A',orange='#C07B48',gray='#AAB7BE';
 const clone=v=>JSON.parse(JSON.stringify(v));
 const format=v=>typeof v==='number'?(Math.abs(v)<1e-10?'0':Number(v.toPrecision(7)).toLocaleString('en-US',{maximumFractionDigits:7})):String(v);
 const esc=v=>String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
 const dot=(a,b)=>a.reduce((sum,v,i)=>sum+v*b[i],0);
 const table=(headers,rows)=>'<table><thead><tr>'+headers.map(v=>'<th>'+esc(v)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(v=>'<td>'+esc(format(v))+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
 const sceneKeys=['scene','scene2','scene3','scene4'];
 const initialCamera={eye:{x:1.9,y:1.9,z:1.35},center:{x:0,y:0,z:0},up:{x:0,y:0,z:1}};
 let cameras=sceneKeys.map(()=>clone(initialCamera)),data,index=0,sequence=[],playing=false,timer,rendering=false,desired=0,syncing=false,linked=false;
 bundle.datasets.forEach((item,i)=>{const option=document.createElement('option');option.value=i;option.textContent=item.name+'（'+(item.data.rounds.length-1)+' 轮）';el('dataset').appendChild(option);});
 const stop=()=>{playing=false;clearTimeout(timer);el('play').textContent='播放';};
 function sequenceForMode(){sequence=data.rounds.map((r,i)=>i).filter(i=>el('mode').value==='rounds'||i===0||i===data.rounds.length-1||data.rounds[i].cuts>data.rounds[i-1].cuts);}
 function stepIndex(delta){return delta>0?(sequence.find(i=>i>index)??index):([...sequence].reverse().find(i=>i<index)??index);}
 function meshTrace(mesh,color,scene,uid,opacity){
  return {type:'mesh3d',scene,uid,x:mesh.vertices.map(v=>v[0]),y:mesh.vertices.map(v=>v[1]),z:mesh.vertices.map(v=>v[2]),
   i:mesh.triangles.map(t=>t[0]),j:mesh.triangles.map(t=>t[1]),k:mesh.triangles.map(t=>t[2]),color,opacity,flatshading:true,
   lighting:{ambient:.8,diffuse:.55,specular:.05},showlegend:false,
   hovertemplate:'p₁=%{x:.3f} kW<br>p₂=%{y:.3f} kW<br>p₃=%{z:.3f} kW<extra></extra>'};
 }
 function wireTrace(mesh,color,scene,uid,width){return {type:'scatter3d',scene,uid,mode:'lines',x:mesh.edges.map(v=>v?.[0]??null),y:mesh.edges.map(v=>v?.[1]??null),z:mesh.edges.map(v=>v?.[2]??null),line:{color,width},opacity:.55,hoverinfo:'skip',showlegend:false};}
 function renderDetails(id){
  const r=data.rounds[index],m=data.model,host=el(id).querySelector('div');
  if(id==='history'){
   host.innerHTML=table(['轮次','阶段','状态','费用/元','p₁','p₂','p₃','η','割数','建设方案'],data.rounds.slice(1).map(v=>[v.iteration,v.phase,v.status,v.cost??'—',...(v.p??['—','—','—']),v.eta??'—',v.cuts,
    v.x?m.edges.map((e,j)=>{const k=v.x.slice(j*m.lines.length,(j+1)*m.lines.length).findIndex(a=>a>.5);return k<0?'':e+':'+m.lines[k];}).filter(Boolean).join('; '):'—']));return;
  }
  if(!r.x){host.textContent=r.status==='infeasible'?'本轮主问题证明不可行。':'初始外近似，尚无 MP/SP 查询。';return;}
  if(id==='current'){
   host.innerHTML='<p>节点功率（kW）：('+r.p.map(format).join(', ')+')；总负荷 '+format(r.p.reduce((a,b)=>a+b,0))+' kW；建设费 '+format(r.cost)+' 元。</p>'+
    table(['走廊','选择线型','建设费/元'],m.edges.map((e,j)=>{const x=r.x.slice(j*m.lines.length,(j+1)*m.lines.length),k=x.findIndex(v=>v>.5);return [e,k<0?'未建设':m.lines[k],dot(x,m.cost.slice(j*m.lines.length,(j+1)*m.lines.length))];}));
  }else if(id==='states'){
   host.innerHTML='<p>η > 0 时为松弛问题的运行状态；η = 0 才满足原始电气约束。</p>'+table(['变量','数值','单位'],[...m.states.map((name,j)=>[name,r.w[j],j<m.edges.length?'kW':'p.u.²']),['eta',r.eta,'无量纲']]);
  }else if(id==='duals'){
   host.innerHTML=table(['行','约束','SP 不等式','π = −Pi','RHS','Ww−RHS','rη','松弛后余量'],m.rows.map((name,j)=>['E'+String(j+1).padStart(2,'0'),name,m.lhs[j]+' ≤ '+format(r.rhs[j])+' + '+format(m.scales[j])+' η',r.pi[j],r.rhs[j],r.residual[j],m.scales[j]*r.eta,m.scales[j]*r.eta-r.residual[j]]));
  }else if(id==='cuts'){
   host.innerHTML='<p>g = β₀ + βx·x + βp·p ≥ 0。范围固定本轮 x，在 p ≥ 0、Σp ≤ '+format(data.limit)+' kW 上计算；全部旧割保留。</p>'+table(['割','β₀','βp₁','βp₂','βp₃','固定 x 常数','g 最小','g 最大','生成点 g'],data.cuts.slice(0,r.cuts).map((c,j)=>{const b=c.constant+dot(c.x,r.x);return [j+1,c.constant,...c.p,b,b+data.limit*Math.min(0,...c.p),b+data.limit*Math.max(0,...c.p),-c.eta];}));
  }else if(id==='coefficients'){
   host.innerHTML=table(['割',...m.edges.flatMap(e=>m.lines.map(k=>'x_'+e+'_'+k))],data.cuts.slice(0,r.cuts).map((c,j)=>[j+1,...c.x]));
  }
 }
 async function render(i){
  index=i;const r=data.rounds[i],frame=data.frames[r.cuts],before=data.frames[Math.max(0,r.cuts-1)],certified=data.finished&&i===data.rounds.length-1;
  el('slider').value=i;el('iteration').value=i;
  el('status').textContent='第 '+i+' / '+(data.rounds.length-1)+' 轮 · 累计 '+r.cuts+' 条割 · '+r.phase+' · '+(certified?'完整可行域已认证':r.status==='cut'?'新增一条割':r.status==='optimal'?'本轮通过 SP，未新增割':'外近似');
  el('start').disabled=el('previous').disabled=i===0;el('end').disabled=el('next').disabled=i===data.rounds.length-1;
  const fline=(points,color,name,dash='solid')=>({type:'scatter',mode:'lines',x:points[0],y:points[1],line:{color,width:2,dash},name,hovertemplate:'%{x:.3f} kW<br>%{y:.3f} 千元<extra>%{fullData.name}</extra>'});
  const frontier=[fline(data.reference,'#616C73','独立 LP 基准','dash'),fline(frame.frontier,blue,'当前外近似')];
  if(r.cuts&&el('wire').checked)frontier.push(fline(before.frontier,orange,'最近加割前'));
  const traces=[],layout={margin:{l:10,r:10,b:25,t:60},height:el('regions').clientHeight,showlegend:false,paper_bgcolor:'white',font:{family:'Arial, Microsoft YaHei',size:12,color:'#233541'},uirevision:'preserve-camera',annotations:[]};
  data.budgets.forEach((budget,j)=>{
   const scene=sceneKeys[j],panel=frame.panels[j],x=j%2? [.52,1]:[0,.48],y=j<2?[.54,1]:[0,.46];
   const axis=title=>({title:{text:title},range:[0,data.limit],tickvals:[0,50,100,data.limit],gridcolor:'#E4E8EA',zerolinecolor:'#C2CCD2',showbackground:false});
   layout[scene]={domain:{x,y},xaxis:axis('p₁ (kW)'),yaxis:axis('p₂ (kW)'),zaxis:axis('p₃ (kW)'),aspectmode:'cube',camera:clone(cameras[j]),uirevision:'preserve-camera',dragmode:'orbit'};
   layout.annotations.push({xref:'paper',yref:'paper',x:x[0]+.02,y:y[1]+.018,xanchor:'left',yanchor:'bottom',showarrow:false,text:String.fromCharCode(97+j)+'   '+(budget===null?'无建设预算上限':'预算 '+format(budget)+' 元')+'<br><span style="font-size:11px">总负荷'+(certified?'上限':'外上界')+' '+format(panel.capacity)+' kW</span>'});
   traces.push(meshTrace(panel.mesh,blue,scene,'body-'+j,.48),wireTrace(panel.mesh,blue,scene,'edges-'+j,1.2));
   if(el('wire').checked)traces.push(wireTrace(before.panels[j].mesh,gray,scene,'before-'+j,1));
   traces.push(meshTrace(panel.boundary,orange,scene,'cut-'+j,.7));
   if(r.p&&(budget===null||r.cost<=budget))traces.push({type:'scatter3d',scene,uid:'point-'+j,mode:'markers',x:[r.p[0]],y:[r.p[1]],z:[r.p[2]],marker:{size:3,color:orange},showlegend:false,name:'本轮候选',hovertemplate:'本轮候选 (%{x:.3f}, %{y:.3f}, %{z:.3f}) kW<extra></extra>'});
  });
  await Promise.all([
   Plotly.react(el('frontier'),frontier,{height:290,margin:{l:60,r:20,t:15,b:48},font:{family:'Arial, Microsoft YaHei',size:12},xaxis:{title:{text:'总负荷 (kW)'},range:[0,data.frontier_limit]},yaxis:{title:{text:'最低预算 (千元)'},range:[-1,Math.max(...data.reference[1])*1.12]},legend:{x:.01,y:.98,bgcolor:'rgba(255,255,255,.8)'},paper_bgcolor:'white',plot_bgcolor:'white'},{responsive:true,displaylogo:false,modeBarButtonsToRemove:['sendChartToCloud']}),
   Plotly.react(el('regions'),traces,layout,{responsive:true,displaylogo:false,scrollZoom:true,modeBarButtonsToRemove:['sendChartToCloud']})
  ]);
  if(!linked){
   linked=true;el('regions').on('plotly_relayout',async event=>{
    if(syncing)return;
    const change=Object.entries(event).find(([key])=>key.endsWith('.camera'));
    if(!change)return;const [key,camera]=change,j=sceneKeys.indexOf(key.split('.')[0]);cameras[j]=clone(camera);
    if(el('sync').checked){syncing=true;cameras=sceneKeys.map(()=>clone(camera));await Plotly.relayout(el('regions'),Object.fromEntries(sceneKeys.filter((_,k)=>k!==j).map(s=>[s+'.camera',clone(camera)])));syncing=false;}
   });
  }
  for(const id of ['current','states','duals','cuts','coefficients','history'])if(el(id).open)renderDetails(id);
 }
 async function show(i){desired=Math.max(0,Math.min(data.rounds.length-1,Math.round(i)));if(rendering)return;rendering=true;do{const current=desired;await render(current);if(current===desired)break;}while(true);rendering=false;}
 async function tick(){if(!playing)return;const next=stepIndex(1);if(next===index){stop();return;}await show(next);if(playing)timer=setTimeout(tick,+el('speed').value);}
 async function selectDataset(initial=false){
  stop();data=bundle.datasets[+el('dataset').value].data;sequenceForMode();el('slider').max=el('iteration').max=data.rounds.length-1;
  el('parameters').textContent='物理总负荷上限 '+format(data.limit)+' kW';
  await show(initial&&bundle.initial==='last'?data.rounds.length-1:0);
 }
 el('dataset').onchange=()=>selectDataset();el('mode').onchange=()=>{stop();sequenceForMode();};
 el('slider').oninput=()=>{stop();show(+el('slider').value);};el('iteration').onchange=()=>{stop();show(+el('iteration').value);};
 el('start').onclick=()=>{stop();show(0);};el('end').onclick=()=>{stop();show(data.rounds.length-1);};
 el('next').onclick=()=>{stop();show(stepIndex(1));};el('previous').onclick=()=>{stop();show(stepIndex(-1));};
 el('play').onclick=async()=>{if(playing){stop();return;}if(index===data.rounds.length-1)await show(0);playing=true;el('play').textContent='暂停';timer=setTimeout(tick,+el('speed').value);};
 el('wire').onchange=()=>show(index);
 el('reset').onclick=async()=>{syncing=true;cameras=sceneKeys.map(()=>clone(initialCamera));await Plotly.relayout(el('regions'),Object.fromEntries(sceneKeys.map(s=>[s+'.camera',clone(initialCamera)])));syncing=false;};
 for(const id of ['current','states','duals','cuts','coefficients','history'])el(id).addEventListener('toggle',()=>{if(el(id).open)renderDetails(id);});
 await selectDataset(true);
})();
</script></body></html>
